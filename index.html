<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --forest:#1a3a2a;--forest2:#254d38;--forest3:#2e6347;--sage:#5a8a6f;--mint:#a8d5b5;
  --cream:#f7f4ef;--cream2:#ede9e1;--warm:#d4c5a9;--gold:#c9a84c;--gold2:#b8942e;
  --card:#fff;--text:#1c2b22;--muted:#6b7f72;--border:#e0dbd0;
  --red:#d64e4e;--red-bg:#fdf0f0;--green:#2e7d52;--green-bg:#edf7f1;
  --amber:#b87c1a;--amber-bg:#fdf6e8;--blue:#2563eb;--blue-bg:#eff6ff;
  --r:14px;--sh:0 1px 3px rgba(26,58,42,.07),0 6px 20px rgba(26,58,42,.06);
  --shl:0 8px 32px rgba(26,58,42,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:\'Inter\',system-ui,sans-serif;background:var(--cream);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--warm);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:32px;height:32px;border:3px solid var(--forest3);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--forest);padding:20px}
.auth-card{background:var(--card);border-radius:22px;padding:44px 40px;width:100%;max-width:420px;box-shadow:var(--shl)}
.brand-mark{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.brand-icon{width:48px;height:48px;border-radius:12px;background:var(--forest);display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:26px;height:26px;fill:none;stroke:var(--mint);stroke-width:1.8}
.brand-name{font-size:19px;font-weight:700;color:var(--forest);letter-spacing:-.3px}
.brand-name em{font-style:normal;color:var(--gold)}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
.atabs{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:26px}
.atab{flex:1;border:none;background:transparent;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted)}
.atab.on{background:var(--forest);color:#fff}
.fld{margin-bottom:16px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.fld input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14.5px;font-family:inherit;background:var(--cream);color:var(--text)}
.fld input:focus{outline:none;border-color:var(--forest3);background:#fff}
.fld2g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btnp{width:100%;background:var(--forest);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.btnp:hover{filter:brightness(1.08)}.btnp:disabled{opacity:.6;cursor:not-allowed}
.amsg{padding:10px 13px;border-radius:8px;font-size:13.5px;margin-bottom:14px;display:none}
.amsg.err{background:var(--red-bg);color:var(--red);border:1px solid #f5c6c6;display:block}
.amsg.ok{background:var(--green-bg);color:var(--green);border:1px solid #b8dfc8;display:block}
.afoot{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.danc{font-size:11px;color:var(--warm);text-align:center;margin-top:24px;letter-spacing:2px;font-weight:500}
#app-screen{display:none;min-height:100vh}
header{background:var(--forest);padding:0 24px;height:62px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(26,58,42,.2)}
.hbrand{display:flex;align-items:center;gap:10px;color:#fff}
.hico{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.hico svg{width:18px;height:18px;fill:none;stroke:var(--mint);stroke-width:1.8}
.htit{font-size:16px;font-weight:700;letter-spacing:-.2px;color:#fff}
.htit small{font-size:11px;font-weight:400;color:rgba(255,255,255,.5);margin-left:6px}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
.hun{font-size:13px;color:rgba(255,255,255,.7);font-weight:500}
.hav{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--forest);cursor:pointer}
.hout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.hout:hover{background:rgba(255,255,255,.2)}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:62px;z-index:40}
.nb{border:none;background:none;padding:14px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nb:hover{color:var(--forest)}.nb.on{color:var(--forest);border-bottom-color:var(--gold)}
.nb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
main{max-width:1240px;margin:0 auto;padding:24px 24px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:22px}
.ctit{font-size:15px;font-weight:700;color:var(--forest);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:18px 20px}
.sl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.sv{font-size:24px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--cream);color:var(--muted);text-align:left;padding:9px 12px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.hv:hover{background:var(--cream)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;display:inline-block;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green)}.br{background:var(--red-bg);color:var(--red)}
.ba{background:var(--amber-bg);color:var(--amber)}.bb{background:var(--blue-bg);color:var(--blue)}
.bm{background:var(--cream2);color:var(--muted)}
.t-CONS{background:#e8f5e9;color:#2e7d32}.t-DIF{background:#e3f2fd;color:#1565c0}
.t-PAGO{background:#fff3e0;color:#e65100}.t-ND{background:var(--cream2);color:var(--muted)}
.btn{border:none;border-radius:9px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.bfo{background:var(--forest);color:#fff}.bfo:hover{background:var(--forest2)}
.bgo{background:var(--gold);color:var(--forest)}.bgo:hover{background:var(--gold2)}
.bgh{background:var(--cream);color:var(--muted);border:1.5px solid var(--border)}.bgh:hover{color:var(--forest);border-color:var(--sage)}
.bda{background:var(--red-bg);color:var(--red)}
.sm{padding:5px 11px;font-size:12px;border-radius:7px}.xs{padding:3px 8px;font-size:11px;border-radius:6px}
.pw{height:7px;background:var(--cream2);border-radius:4px;overflow:hidden;margin:8px 0}
.pb{height:100%;border-radius:4px;transition:width .6s ease}
.ff{margin-bottom:14px}
.ff label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.ff input,.ff select,.ff textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--text)}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--forest3);background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.segtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.segtab{border:1.5px solid var(--border);background:var(--cream);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s}
.segtab:hover{border-color:var(--sage);color:var(--forest)}
.segtab.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.mbg{position:fixed;inset:0;background:rgba(26,58,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:clamp(8px,3vw,24px);backdrop-filter:blur(4px);overflow-y:auto}
.mbg.on{display:flex}
.mbox{background:var(--card);border-radius:18px;padding:clamp(16px,4vw,32px);width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto;max-height:calc(100vh - clamp(16px,6vw,48px));overflow-y:auto;display:flex;flex-direction:column}
.mbox h3{font-size:clamp(15px,2.5vw,17px);font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:var(--forest);position:sticky;top:0;background:var(--card);padding-bottom:10px;border-bottom:1px solid var(--border);z-index:1;flex-shrink:0}
.mx{cursor:pointer;color:var(--muted);font-size:24px;font-weight:300;line-height:1;padding:4px;min-width:32px;text-align:center}
@media(min-width:900px){.mbox{max-width:860px}}
@media(max-width:640px){.mbox{border-radius:14px;max-height:calc(100vh - 16px)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:300;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;pointer-events:auto}
.toast{display:flex;align-items:center;gap:14px}
.toast-btn{background:none;border:none;color:var(--gold);font:inherit;font-weight:700;cursor:pointer;padding:2px 4px}
.toast-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mesbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.mesbar h2{font-size:16px;font-weight:700;min-width:96px;text-align:center}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.obl-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:18px;margin-bottom:10px;cursor:pointer;animation:fadein .3s ease;border-left:4px solid var(--sage);transition:.15s}
.obl-card:hover{box-shadow:var(--shl);transform:translateY(-1px)}
.obl-card.md{border-left-color:var(--green)}.obl-card.ld{border-left-color:var(--red)}
.chart-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:22px;position:relative;overflow:hidden}
.chart-card-title{font-size:14px;font-weight:700;color:var(--forest);margin-bottom:4px}
.chart-card-sub{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;height:200px}
.chart-legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-label{flex:1;color:var(--text);font-weight:500}
.legend-pct{color:var(--muted);font-weight:700}
.part-row{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:9px;padding:9px 11px;margin-bottom:6px}
.part-row input{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;background:#fff}
.detail-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.detail-item:last-child{border-bottom:none}
.detail-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dir-btn{flex:1;border:none;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
@media(max-width:640px){.f2,.fld2g,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}main{padding:14px 14px 70px}.mbox{padding:18px}.auth-card{padding:28px 20px}.nb{padding:12px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand-mark">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-linecap="round"/><path d="M12 6v6l4 2" stroke-linecap="round"/></svg></div>
      <div><div class="brand-name">Finanzas <em>Personales</em></div><div class="brand-sub">Control inteligente de tus finanzas</div></div>
    </div>
    <div class="atabs"><button class="atab on" onclick="swTab(\'l\')">Ingresar</button><button class="atab" onclick="swTab(\'r\')">Registrarse</button></div>
    <div id="amsg" class="amsg"></div>
    <div id="tl">
      <div class="fld"><label>Correo</label><input type="email" id="le" placeholder="tu@correo.com" onkeydown="if(event.key===\'Enter\')doLogin()"></div>
      <div class="fld"><label>Contraseña</label><input type="password" id="lp" placeholder="••••••••" onkeydown="if(event.key===\'Enter\')doLogin()"></div>
      <button class="btnp" onclick="doLogin()" id="blg">Ingresar a mi cuenta</button>
      <div class="afoot"><a href="#" onclick="doReset()" style="color:var(--forest3);font-weight:600">¿Olvidaste tu contraseña?</a></div>
    </div>
    <div id="tr" style="display:none">
      <div class="fld2g">
        <div class="fld"><label>Nombre</label><input type="text" id="rn" placeholder="Juan"></div>
        <div class="fld"><label>Apellido</label><input type="text" id="ra" placeholder="Pérez"></div>
      </div>
      <div class="fld"><label>Correo</label><input type="email" id="re" placeholder="tu@correo.com"></div>
      <div class="fld"><label>Contraseña (mín. 8 caracteres)</label><input type="password" id="rp" placeholder="••••••••"></div>
      <button class="btnp" onclick="doRegister()" id="brg">Crear mi cuenta gratuita</button>
    </div>
    <div class="danc">D · A · N · C</div>
  </div>
</div>
<div id="app-screen">
  <header>
    <div class="hbrand">
      <div class="hico"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-linecap="round"/><path d="M12 6v6l4 2" stroke-linecap="round"/></svg></div>
      <div class="htit">Finanzas Personales <small>beta</small></div>
    </div>
    <div class="hr">
      <span class="hun" id="hun"></span>
      <div class="hav" id="hav" onclick="mPerfil()">?</div>
      <button class="hout" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <nav>
    <button class="nb on" data-v="resumen" onclick="goNav(this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Inicio</button>
    <button class="nb" data-v="presupuesto" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke-linecap="round"/></svg>Mi mes</button>
    <button class="nb" data-v="obligaciones" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke-linecap="round"/></svg>Deudas</button>
    <button class="nb" data-v="ahorros" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 00-1-1H5a2 2 0 000 4h15a1 1 0 011 1v4h-3a2 2 0 000 4h3a1 1 0 001-1v-2a1 1 0 00-1-1" stroke-linecap="round"/><path d="M3 5v14a2 2 0 002 2h15a1 1 0 001-1v-4" stroke-linecap="round"/></svg>Metas</button>
    <button class="nb" data-v="extractos" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15" stroke-linecap="round"/></svg>Importar</button>
    <button class="nb" data-v="nieve" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M2 12h20M12 2l-4 4m4-4l4 4M12 22l-4-4m4 4l4-4" stroke-linecap="round"/></svg>Plan de pago</button>
    <button class="nb" data-v="libros" onclick="goNav(this)"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke-linecap="round"/></svg>Fondos</button>
    <button class="nb" data-v="qs" onclick="goNav(this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9" stroke-linecap="round"/></svg>Crédito casa</button>
  </nav>
  <main id="main"></main>
</div>
<div class="mbg" id="mbg"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// CORE — Supabase, estado global, utilidades
// ══════════════════════════════════════════════════════════
const SB = supabase.createClient(
  "https://dzlxyapzbdhfdundgcpm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6bHh5YXB6YmRoZmR1bmRnY3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Nzc1NzUsImV4cCI6MjA5ODA1MzU3NX0.3TugcXH-1amdvfnVcWHDwKftXRCDSPxV64DYL4XLgMU",
  {auth:{persistSession:true,storageKey:'fp-danc',autoRefreshToken:true,detectSessionInUrl:false}}
);

let U=null, P=null, V='resumen';
let mesV=new Date().getMonth()+1, anioV=new Date().getFullYear();
const MES=mesV, ANIO=anioV;   // mes de hoy (fijo). El mes que se está viendo es mesV/anioV.
// Selector de mes compartido por Inicio, Mi mes e Importar.
function cambiarMes(d){const x=new Date(anioV,mesV-1+d,1);mesV=x.getMonth()+1;anioV=x.getFullYear();rv()}
function irMesActual(){mesV=MES;anioV=ANIO;rv()}
function barraMes(extra=''){
  return `<div class="mesbar">
    <button class="btn bgh sm" onclick="cambiarMes(-1)" aria-label="Mes anterior">‹</button>
    <h2>${mesN(mesV)} ${anioV}</h2>
    <button class="btn bgh sm" onclick="cambiarMes(1)" aria-label="Mes siguiente">›</button>
    ${mesV!==MES||anioV!==ANIO?'<button class="btn bgh sm" onclick="irMesActual()">Ir al mes actual</button>':''}
    ${extra}
  </div>`;
}
let segV='Todos', vistaObl='lista', oblDir='me_deben', partsG=[];
let qsMesSel=null, qsFiltro=null;

const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const fmt=v=>'$ '+(+v||0).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const hoy=()=>new Date().toISOString().slice(0,10);
const mesN=m=>['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][m-1];

// ── Cálculo único de obligaciones: todas las pantallas usan estas funciones ──
// Pagado = todo lo abonado en sus cuotas, sin importar el estado de cada cuota
// (un abono parcial también es dinero recibido).
const r2=x=>Math.round((+x||0)*100)/100;
const pagadoObl=o=>r2((o.cuotas||[]).reduce((s,c)=>s+(+c.valor_pagado||0),0));
const saldoObl=o=>Math.max(r2(+o.monto_total-pagadoObl(o)),0);
const avanceObl=o=>+o.monto_total>0?Math.min(pagadoObl(o)/+o.monto_total*100,100):0;
// Dirección: "me deben" = la creé yo y no es deuda propia.
// "le debo" = la creé yo como deuda propia, o alguien más me registró como deudor.
const esMeDeben=(o,uid)=>o.titular_id===uid&&!o.es_deuda_propia;
const esLeDebo=(o,uid)=>(o.titular_id===uid&&o.es_deuda_propia===true)||(o.deudor_id===uid&&o.titular_id!==uid);
const SEGS=['Todos','Créditos Bancarios','Avances / Tarjetas','Préstamos Personales','Gastos Compartidos'];
const SEGCOL={'Créditos Bancarios':'#2563eb','Avances / Tarjetas':'#b87c1a','Préstamos Personales':'#2e7d52','Gastos Compartidos':'#5a8a6f'};

let _toastTmr=null;
function toast(m,d=2400){const t=$('#toast');clearTimeout(_toastTmr);t.textContent=m;t.classList.add('on');_toastTmr=setTimeout(()=>t.classList.remove('on'),d)}
// Aviso con botón "Deshacer" (8 s). fn debe devolver true si pudo restaurar.
function toastDeshacer(m,fn){
  const t=$('#toast');clearTimeout(_toastTmr);t.innerHTML='';
  const s=document.createElement('span');s.textContent=m;
  const b=document.createElement('button');b.type='button';b.className='toast-btn';b.textContent='Deshacer';
  let usado=false;
  b.onclick=async()=>{if(usado)return;usado=true;t.classList.remove('on');
    const ok=await fn();toast(ok?'Restaurado ✓':'No se pudo restaurar. Inténtalo de nuevo.',3500)};
  t.append(s,b);t.classList.add('on');_toastTmr=setTimeout(()=>t.classList.remove('on'),8000);
}
// Mensaje de error para el usuario; el detalle técnico va a la consola.
function errTxt(accion,e){if(e)console.error(e);return `No se pudo ${accion}. Inténtalo de nuevo; si sigue fallando, recarga la página.`}
function errAuth(e){
  const m=(e?.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'Correo o contraseña incorrectos.';
  if(m.includes('not confirmed'))return 'Tu correo aún no está confirmado. Revisa tu bandeja de entrada.';
  if(m.includes('already'))return 'Ya existe una cuenta con ese correo. Ingresa o recupera tu contraseña.';
  if(m.includes('rate limit')||m.includes('too many'))return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
  if(m.includes('password'))return 'La contraseña no cumple los requisitos: mínimo 8 caracteres.';
  if(m.includes('fetch')||m.includes('network'))return 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.';
  console.error(e);return 'No se pudo completar la operación. Inténtalo de nuevo.';
}
// Borra un registro guardando una copia (con sus filas hijas) para poder deshacer.
// hijos: [{tabla, fk}] — filas que la base borra en cascada junto con el registro.
async function borrarConDeshacer({tabla,id,hijos=[],msg,despues}){
  const{data:fila,error:e1}=await SB.from(tabla).select('*').eq('id',id).single();
  if(e1||!fila)return toast(errTxt('eliminar el registro',e1),5000);
  const copias=[];
  for(const hj of hijos){
    const{data,error}=await SB.from(hj.tabla).select('*').eq(hj.fk,id);
    if(error)return toast(errTxt('eliminar el registro',error),5000);
    copias.push({tabla:hj.tabla,filas:data||[]});
  }
  const{error}=await SB.from(tabla).delete().eq('id',id);
  if(error)return toast(errTxt('eliminar el registro',error),5000);
  if(despues)await despues();
  toastDeshacer(msg,async()=>{
    const{error:r1}=await SB.from(tabla).insert(fila);
    if(r1){console.error(r1);return false}
    for(const c of copias){
      if(!c.filas.length)continue;
      const{error:r2}=await SB.from(c.tabla).insert(c.filas);
      if(r2){console.error(r2);return false}
    }
    if(despues)await despues();
    return true;
  });
}

function amsg(m,t='err'){const e=$('#amsg');e.textContent=m;e.className='amsg '+t}

async function doLogin(){
  const em=$('#le').value.trim(), pw=$('#lp').value;
  if(!em||!pw)return amsg('Ingresa correo y contraseña.');
  const btn=$('#blg');btn.disabled=true;btn.textContent='Verificando...';
  const{error}=await SB.auth.signInWithPassword({email:em,password:pw});
  if(error){amsg(errAuth(error));btn.disabled=false;btn.textContent='Ingresar a mi cuenta'}
}
async function doRegister(){
  const n=$('#rn').value.trim(),a=$('#ra').value.trim(),e=$('#re').value.trim(),p=$('#rp').value;
  if(!n||!a||!e||!p)return amsg('Completa todos los campos.');
  if(p.length<8)return amsg('Contraseña: mínimo 8 caracteres.');
  const btn=$('#brg');btn.disabled=true;btn.textContent='Creando cuenta...';
  const{error}=await SB.auth.signUp({email:e,password:p,options:{data:{nombre:n,apellido:a}}});
  if(error){amsg(errAuth(error));btn.disabled=false;btn.textContent='Crear mi cuenta gratuita'}
  else amsg('¡Cuenta creada! Revisa tu correo.','ok');
}
async function doReset(){
  const e=$('#le').value.trim();
  if(!e)return amsg('Escribe tu correo en el campo "Correo" y vuelve a pulsar "¿Olvidaste tu contraseña?".');
  const{error}=await SB.auth.resetPasswordForEmail(e);
  if(error)return amsg(errAuth(error));
  amsg('Te enviamos un correo a '+e+' con un enlace para crear una nueva contraseña.','ok');
}
async function doLogout(){await SB.auth.signOut()}

SB.auth.onAuthStateChange(async(ev,sess)=>{

  if(sess?.user){
    U=sess.user;
    const{data}=await SB.from('perfiles').select('*').eq('id',U.id).maybeSingle();
    P=data;
    $('#auth-screen').style.display='none';
    $('#app-screen').style.display='block';
    const nm=((P?.nombre||'')+(P?.apellido?' '+P.apellido:'')).trim()||U.email.split('@')[0];

    rv();

    $('#app-screen').style.display='none';

});

async function savPerfil(){
  const n=$('#pn').value.trim(),a=$('#pa').value.trim();
  if(!n)return toast('Escribe tu nombre.');
  await SB.from('perfiles').upsert({id:U.id,nombre:n,apellido:a},{onConflict:'id'});
  P={...P,nombre:n,apellido:a};
  $('#hun').textContent=(n+' '+a).trim();
  $('#hav').textContent=n.charAt(0).toUpperCase();
  toast('Perfil actualizado ✓');closeM();
}
async function savPass(){
  const np=$('#np').value, np2=$('#np2').value;
  if(np.length<8)return toast('La contraseña debe tener al menos 8 caracteres.',3500);
  if(np!==np2)return toast('Las dos contraseñas no coinciden.',3500);
  const{error}=await SB.auth.updateUser({password:np});
  if(error)return toast(errAuth(error),5000);
  toast('Contraseña actualizada ✓');closeM();
}

let chartPie=null, chartBar=null;

async function rR(){
  $('#main').innerHTML=ld();
  const uid=U.id;
  const[{data:ing},{data:gas},{data:obls}]=await Promise.all([
    SB.from('ingresos').select('valor').eq('usuario_id',uid).eq('anio',anioV).eq('mes',mesV),
    SB.from('gastos').select('valor,naturaleza,categoria').eq('usuario_id',uid).eq('anio',anioV).eq('mes',mesV),
    SB.from('obligaciones').select('*,cuotas(valor_pagado,estado)').or(`titular_id.eq.${uid},deudor_id.eq.${uid}`).eq('estado','activa')
  ]);
  const tI=(ing||[]).reduce((a,r)=>a+(+r.valor),0);
  const tG=(gas||[]).reduce((a,r)=>a+(+r.valor),0);
  const meDeben=(obls||[]).filter(o=>esMeDeben(o,uid)).reduce((a,o)=>a+saldoObl(o),0);

  const byCat={};
  (gas||[]).forEach(g=>{byCat[g.categoria]=(byCat[g.categoria]||0)+(+g.valor)});
  const catLabels=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]).slice(0,8);
  const catVals=catLabels.map(k=>byCat[k]);
  const PALETTE=['#1a3a2a','#2e6347','#c9a84c','#5a8a6f','#8a6d3b','#a8d5b5','#b87c1a','#6b7f72'];

  const meses6=[],ingMes=[],gasMes=[];
  for(let i=5;i>=0;i--){
    const d=new Date(anioV,mesV-1-i,1);
    const m=d.getMonth()+1,y=d.getFullYear();
    meses6.push(mesN(m));
    const[{data:ii},{data:gg}]=await Promise.all([
      SB.from('ingresos').select('valor').eq('usuario_id',uid).eq('anio',y).eq('mes',m),
      SB.from('gastos').select('valor').eq('usuario_id',uid).eq('anio',y).eq('mes',m)
    ]);
    ingMes.push((ii||[]).reduce((a,r)=>a+(+r.valor),0));
    gasMes.push((gg||[]).reduce((a,r)=>a+(+r.valor),0));
  }

  $('#main').innerHTML=`
  ${barraMes()}
  <div class="g3">
    <div class="sc"><div class="sl">Ingresos</div><div class="sv pos">${fmt(tI)}</div></div>
    <div class="sc"><div class="sl">Gastos</div><div class="sv ${tG>tI?'neg':'warn'}">${fmt(tG)}</div></div>
    <div class="sc"><div class="sl">Balance</div><div class="sv ${tI-tG>=0?'pos':'neg'}">${fmt(tI-tG)}</div></div>
    <div class="sc"><div class="sl">Me deben (total)</div><div class="sv pos">${fmt(meDeben)}</div></div>
  </div>
  <div class="g2" style="margin-bottom:20px">
    <div class="chart-card">
      <div class="chart-card-title">Distribución de gastos</div>
      <div class="chart-card-sub">Por categoría · ${mesN(mesV)} ${anioV}</div>
      ${catLabels.length
        ?`<div class="chart-wrap"><canvas id="cPie"></canvas></div><div id="pie-legend" class="chart-legend"></div>`
        :'<div class="empty"><p>Sin gastos registrados este mes.</p></div>'}
    </div>
    <div class="chart-card">
      <div class="chart-card-title">Flujo de caja</div>
      <div class="chart-card-sub">Ingresos vs gastos · últimos 6 meses</div>
      <div class="chart-wrap"><canvas id="cBar"></canvas></div>
    </div>
  </div>
  ${(obls||[]).length?`<div class="card"><div class="ctit">Obligaciones activas <button class="btn bfo sm" onclick="goNav(document.querySelector('[data-v=obligaciones]'));rO()">Ver todas</button></div>
  <div class="tw"><table><tr><th>Concepto</th><th>Segmento</th><th>Persona</th><th>Saldo</th></tr>
  ${(obls||[]).slice(0,6).map(o=>{
    const s=saldoObl(o), cobro=esMeDeben(o,uid);
    return `<tr class="hv" data-oblid="${o.id}">
      <td><b>${o.nombre}</b></td>
      <td><span class="badge bm" style="font-size:10px">${o.segmento||'—'}</span></td>
      <td>${cobro?'← ':'→ '}${o.deudor_nombre||'—'}</td>
      <td class="num ${cobro?'pos':'neg'}">${fmt(s)}</td></tr>`;
  }).join('')}</table></div></div>`:''}`;

  setTimeout(()=>{
    if(catLabels.length){
      const ctx=document.getElementById('cPie')?.getContext('2d');
      if(ctx){
        if(chartPie){try{chartPie.destroy()}catch(e){}}
        chartPie=new Chart(ctx,{type:'doughnut',data:{labels:catLabels,datasets:[{data:catVals,backgroundColor:PALETTE,borderWidth:3,borderColor:'#fff',hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a3a2a',padding:10,cornerRadius:8,callbacks:{label:c=>' '+c.label+': '+fmt(c.parsed)}}},animation:{duration:600}}});
        const tot=catVals.reduce((a,v)=>a+v,0);
        const leg=document.getElementById('pie-legend');
        if(leg)leg.innerHTML=catLabels.map((l,i)=>`<div class="legend-item"><span class="legend-dot" style="background:${PALETTE[i%8]}"></span><span class="legend-label">${l}</span><span class="legend-pct">${tot>0?((catVals[i]/tot)*100).toFixed(0):0}%</span></div>`).join('');
      }
    }
    const ctx2=document.getElementById('cBar')?.getContext('2d');
    if(ctx2){
      if(chartBar){try{chartBar.destroy()}catch(e){}}
      const gI=ctx2.createLinearGradient(0,0,0,200);gI.addColorStop(0,'rgba(46,99,71,.85)');gI.addColorStop(1,'rgba(46,99,71,.45)');
      const gG=ctx2.createLinearGradient(0,0,0,200);gG.addColorStop(0,'rgba(201,168,76,.85)');gG.addColorStop(1,'rgba(201,168,76,.4)');
      chartBar=new Chart(ctx2,{type:'bar',data:{labels:meses6,datasets:[
        {label:'Ingresos',data:ingMes,backgroundColor:gI,borderRadius:7,borderSkipped:false,maxBarThickness:26},
        {label:'Gastos',data:gasMes,backgroundColor:gG,borderRadius:7,borderSkipped:false,maxBarThickness:26}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',align:'end',labels:{font:{size:11,weight:'600'},boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle',padding:14}},tooltip:{backgroundColor:'#1a3a2a',padding:10,cornerRadius:8,callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString(),font:{size:10},color:'var(--muted)'},grid:{color:'rgba(26,58,42,.05)'},border:{display:false}},x:{ticks:{font:{size:11,weight:'600'},color:'var(--muted)'},grid:{display:false},border:{display:false}}},animation:{duration:600}}});
    }
  },60);
}

  else if(action==='pagar-cuota') mPagCuota(btn.dataset.cuotaid,+btn.dataset.pend,CURRENT_OBL?.id);

      msg:'Obligación eliminada',despues:async()=>{closeM();await rO()}});

  else if(action==='reopen-obl') togObl(btn.dataset.id,'cerrada');
});

async function rO(){
  $('#main').innerHTML=ld();
  const uid=U.id;
  const{data:obls}=await SB.from('obligaciones')
    .select('*,cuotas(*)')
    .or(`titular_id.eq.${uid},deudor_id.eq.${uid}`)
    .order('created_at',{ascending:false});

  const act=(obls||[]).filter(o=>o.estado==='activa');
  const cerr=(obls||[]).filter(o=>o.estado!=='activa');
  const filtAct=segV==='Todos'?act:act.filter(o=>(o.segmento||'')===segV);

  const meDeben=filtAct.filter(o=>esMeDeben(o,uid));
  const leDebo=filtAct.filter(o=>esLeDebo(o,uid));

  function oblCard(o,esMio){
    const sal=saldoObl(o);
    const pag=pagadoObl(o);
    const pct=avanceObl(o);
    // For "me deben": persona = who owes me = deudor_nombre
    // For "le debo": persona = who I owe = deudor_nombre (they're the creditor)
    const persona=o.deudor_nombre||'—';
    const col=esMio?'var(--green)':'var(--red)';
    const segCol=SEGCOL[o.segmento||'']||'#5a8a6f';
    return `<div class="obl-card ${esMio?'md':'ld'}" data-oblid="${o.id}" data-esmio="${esMio}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <div style="font-weight:700;font-size:14.5px;margin-bottom:3px">${o.nombre}</div>
          <div style="font-size:12px;color:var(--muted)">${esMio?'← '+persona+' te debe':'→ Le debes a '+persona}</div>
          <span class="badge bm" style="font-size:10px;margin-top:5px;border-left:3px solid ${segCol}">${o.segmento||'—'}</span>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:20px;font-weight:800;color:${col}">${fmt(sal)}</div>
          <div style="font-size:10px;color:var(--muted)">pendiente</div>
        </div>
      </div>
      <div class="pw" style="margin-top:10px"><div class="pb" style="width:${pct}%;background:${col}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)">
        <span>Pagado ${fmt(pag)} de ${fmt(+o.monto_total)}</span><span>${pct.toFixed(0)}%</span>
      </div>
    </div>`;
  }

  const tMD=meDeben.reduce((a,o)=>a+saldoObl(o),0);
  const tLD=leDebo.reduce((a,o)=>a+saldoObl(o),0);

  // Por persona grouping
  const porPersona={};
  meDeben.forEach(o=>{
    const nom=o.deudor_nombre||'Sin asignar';
    if(!porPersona[nom])porPersona[nom]={obls:[],saldo:0};
    porPersona[nom].obls.push(o);
    porPersona[nom].saldo+=saldoObl(o);
  });
  const personas=Object.keys(porPersona).sort((a,b)=>porPersona[b].saldo-porPersona[a].saldo);

  $('#main').innerHTML=`
  <div class="g3">
    <div class="sc"><div class="sl">Me deben</div><div class="sv pos">${fmt(tMD)}</div></div>
    <div class="sc"><div class="sl">Le debo</div><div class="sv neg">${fmt(tLD)}</div></div>
    <div class="sc"><div class="sl">Posición neta</div><div class="sv ${tMD-tLD>=0?'pos':'neg'}">${fmt(tMD-tLD)}</div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <div class="segtabs">
      ${SEGS.map(s=>`<button class="segtab ${segV===s?'on':''}" onclick="segV='${s}';rO()">${s}</button>`).join('')}
    </div>
    <button class="btn bgo sm" onclick="mNuevaObl()">＋ Nueva</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:16px">
    <button class="btn ${vistaObl==='lista'?'bfo':'bgh'} sm" onclick="vistaObl='lista';rO()">Lista</button>
    <button class="btn ${vistaObl==='persona'?'bfo':'bgh'} sm" onclick="vistaObl='persona';rO()">Por persona</button>
  </div>

async function mPagCuota(cid,sug,oblId){
  openM(ld());
  const{data:c,error:errC}=await SB.from('cuotas').select('*').eq('id',cid).single();
  if(errC||!c){closeM();return toast('No se pudo abrir la cuota. Inténtalo de nuevo.',4000)}
  const esperado=+c.valor_esperado||0, yaPagado=+c.valor_pagado||0;
  const pend=Math.max(r2(esperado-yaPagado),0);
  openM(`<h3>Registrar pago <span class="mx" onclick="closeM()">×</span></h3>
  <div style="background:var(--cream);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px">
    <div style="font-weight:700;margin-bottom:4px">${c.concepto||'Cuota'}</div>
    <div style="color:var(--muted)">Esperado ${fmt(esperado)} · Ya abonado ${fmt(yaPagado)} · Pendiente <b style="color:var(--text)">${fmt(pend)}</b></div>
  </div>
  <div class="ff"><label>Valor de este pago ($)</label><input id="pv" type="number" step="0.01" value="${pend.toFixed(2)}"></div>
  <div id="pmsg" style="font-size:12.5px;color:var(--muted);margin:-6px 0 14px"></div>
  <div class="ff"><label>Fecha del pago</label><input id="pf" type="date" value="${hoy()}"></div>
  <div class="ff"><label>Nota (referencia, transferencia…)</label><input id="pn" placeholder="Opcional"></div>
  <button class="btn bfo" style="width:100%" id="btn-sav-pag">Confirmar pago</button>`);
  const pv=document.getElementById('pv'), pmsg=document.getElementById('pmsg');
  const aviso=()=>{
    const v=+pv.value||0, queda=r2(esperado-yaPagado-v);
    pmsg.textContent=v<=0?'':queda>0.004?`Abono parcial: la cuota queda con ${fmt(queda)} pendiente.`
      :queda<-0.004?`El pago supera lo pendiente por ${fmt(-queda)}. La cuota queda pagada.`:'Con este pago la cuota queda pagada.';
  };
  pv.oninput=aviso; aviso();
  document.getElementById('btn-sav-pag').onclick=async()=>{
    const v=r2(+pv.value);
    if(!(v>0))return toast('Escribe un valor mayor a cero.');
    const nuevo=r2(yaPagado+v);
    // El estado se deduce del total abonado: completo = pagado; parcial = sigue pendiente
    // (una cuota marcada "revisar" conserva esa marca hasta completarse).
    const estado=nuevo>=esperado-0.004?'pagado':(c.estado==='revisar'?'revisar':'pendiente');
    const notaNueva=document.getElementById('pn').value.trim();
    const nota=notaNueva?(c.nota?c.nota+' · ':'')+notaNueva:(c.nota||'');
    const btn=document.getElementById('btn-sav-pag');btn.disabled=true;btn.textContent='Guardando…';
    const{error}=await SB.from('cuotas').update({
      valor_pagado:nuevo,fecha_pago:document.getElementById('pf').value,nota,estado
    }).eq('id',cid);
    if(error){btn.disabled=false;btn.textContent='Confirmar pago';return toast(errTxt('guardar el pago',error),5000)}
    toast(estado==='pagado'?'Pago registrado ✓':'Abono registrado ✓');
    if(oblId){await vObl(oblId)}else closeM();
    rO();
  };
}

async function savNuevaObl(){
  const nom=document.getElementById('on').value.trim();
  const m=+document.getElementById('om').value;
  const seg=document.getElementById('oseg').value;
  const nombreP=document.getElementById('onp').value.trim();
  const email=document.getElementById('oe').value.trim().toLowerCase();
  const f=document.getElementById('ofi').value;
  const notas=document.getElementById('ono').value||'';
  if(!nom||!m)return toast('Completa el nombre y el monto.');
  const uid=U.id;
  const esDeuPropia=oblDir==='le_debo';
  const{data:obl,error}=await SB.from('obligaciones').insert({
    titular_id:uid,
    deudor_id:uid,
    nombre:nom,
    descripcion:seg,
    segmento:seg,
    deudor_nombre:nombreP,
    deudor_email:email||null,
    monto_total:m,
    fecha_inicio:f,
    num_cuotas:+document.getElementById('oq').value||null,
    valor_cuota:+document.getElementById('ovc').value||null,
    notas:notas+(esDeuPropia?'\n[Le debo a: '+nombreP+']':''),
    estado:'activa',
    es_deuda_propia:esDeuPropia
  }).select().single();
  if(error)return toast(errTxt('crear la obligación',error),5000);
  const nc=+document.getElementById('oq').value;
  if(nc>0){
    const vc=+document.getElementById('ovc').value||m/nc;
    const[y,mo]=f.split('-').map(Number);
    const rows=[];
    for(let i=1;i<=nc;i++){
      const mm=(mo-1+(i-1))%12+1, yy=y+Math.floor((mo-1+(i-1))/12);
      rows.push({obligacion_id:obl.id,numero:i,concepto:`Cuota ${i}`,fecha_prog:`${yy}-${String(mm).padStart(2,'0')}-01`,valor_esperado:vc,valor_pagado:0,estado:'pendiente'});
    }
    await SB.from('cuotas').insert(rows);
  } else {
    await SB.from('cuotas').insert({obligacion_id:obl.id,numero:1,concepto:'Saldo pendiente',valor_esperado:m,valor_pagado:0,estado:'pendiente'});
  }
  if(email) await SB.from('invitaciones').insert({remitente_id:uid,destinatario_email:email,obligacion_id:obl.id}).catch(()=>{});
  toast('Obligación creada ✓'+(esDeuPropia?' (Le debo)':' (Me deben)'));
  closeM();rO();
}

async function rQS(){
  $('#main').innerHTML=ld();
  const uid=U.id;
  const{data:creditos}=await SB.from('qs_creditos')
    .select('*,qs_pagadores(*)')
    .eq('usuario_id',uid).eq('activo',true).order('responsable');

  if(!creditos?.length){
    $('#main').innerHTML=`<div class="empty">
      <p style="font-weight:700;color:var(--text);margin-bottom:6px">Aún no tienes un crédito de la casa</p>
      <p style="margin-bottom:16px">Regístralo con su capital, la cuota mensual y quiénes la pagan. Después marcas cada mes quién pagó.</p>
      <button class="btn bfo" onclick="mNuevoQS()">＋ Registrar crédito</button></div>`;
    return;
  }

  const credIds=creditos.map(c=>c.id);
  const{data:pagos}=await SB.from('qs_pagos')
    .select('*').in('qs_credito_id',credIds).order('mes',{ascending:false});

  const resumen=creditos.map(c=>{
    const pp=(pagos||[]).filter(p=>p.qs_credito_id===c.id);
    const totalPagado=pp.reduce((a,p)=>a+(+p.valor),0);
    const saldo=Math.max(+c.capital_total-totalPagado,0);
    const pct=+c.capital_total>0?Math.min(totalPagado/+c.capital_total*100,100):0;
    return{...c,totalPagado,saldo,pct,pagos:pp};
  });

  const granTotal=resumen.reduce((a,c)=>a+(+c.capital_total),0);
  const granPagado=resumen.reduce((a,c)=>a+c.totalPagado,0);
  const granSaldo=granTotal-granPagado;

  let h='';
  h+=`<div class="g3" style="margin-bottom:24px">`;
  h+=`<div class="sc"><div class="sl">Capital total</div><div class="sv">${fmt(granTotal)}</div></div>`;

    h+=`<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px">`;

    h+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">`;

    h+=`<span style="font-size:11.5px;color:var(--forest3);font-weight:600">${c.pagos.length} registros →</span>`;

  $('#main').innerHTML=h;

  window._qsPagos=pagos||[];
}

function mNuevoQS(){
  openM(`<h3>Nuevo crédito de la casa <span class="mx" onclick="closeM()">×</span></h3>
  <div class="ff"><label>Responsable del crédito</label><input id="qn-resp" placeholder="Ej: Ampary, Patricia…"></div>
  <div class="f2">
    <div class="ff"><label>Capital total ($)</label><input id="qn-cap" type="number" step="0.01"></div>
    <div class="ff"><label>Cuota mensual ($)</label><input id="qn-cuota" type="number" step="0.01"></div>
  </div>
  <div class="ff"><label>Primer mes de pago</label><input id="qn-ini" type="month" value="${ANIO}-${String(MES).padStart(2,'0')}"></div>
  <div class="ff"><label>Quiénes pagan la cuota</label><input id="qn-pag" placeholder="Ej: Kathy, Cris">
    <div style="font-size:12px;color:var(--muted);margin-top:5px">Separa los nombres con comas. La cuota sugerida se reparte entre ellos.</div></div>
  <button class="btn bfo" style="width:100%" id="btn-sav-qs">Registrar crédito</button>`);
  document.getElementById('btn-sav-qs').onclick=async function(){
    const resp=document.getElementById('qn-resp').value.trim();
    const cap=r2(+document.getElementById('qn-cap').value), cuota=r2(+document.getElementById('qn-cuota').value);
    const ini=document.getElementById('qn-ini').value;
    const pags=document.getElementById('qn-pag').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!resp||!(cap>0)||!(cuota>0)||!ini||!pags.length)
      return toast('Completa el responsable, el capital, la cuota, el primer mes y al menos un pagador.',4500);
    this.disabled=true;this.textContent='Guardando…';
    const{data:cred,error}=await SB.from('qs_creditos').insert({usuario_id:U.id,responsable:resp,capital_total:cap,
      cuota_nominal:cuota,fecha_inicio:ini+'-01',activo:true}).select().single();
    if(error){this.disabled=false;this.textContent='Registrar crédito';return toast(errTxt('registrar el crédito',error),5000)}
    const{error:e2}=await SB.from('qs_pagadores').insert(pags.map(nombre=>({qs_credito_id:cred.id,nombre})));
    if(e2){
      // Sin pagadores el crédito no sirve: se deshace para no dejarlo a medias.
      await SB.from('qs_creditos').delete().eq('id',cred.id);
      this.disabled=false;this.textContent='Registrar crédito';
      return toast(errTxt('registrar los pagadores',e2),5000);
    }
    toast('Crédito registrado ✓');closeM();rQS();
  };
}
async function vQSCredito(creditoId){
  const credito=window._qsCreditos?.find(c=>c.id===creditoId);
  if(!credito)return;
  openM(ld());

  // Fetch fresh pagos for this credito
  const{data:pagos}=await SB.from('qs_pagos')
    .select('*').eq('qs_credito_id',creditoId).order('mes',{ascending:false});

  const totalPagado=(pagos||[]).reduce((a,p)=>a+(+p.valor),0);
  const saldo=Math.max(+credito.capital_total-totalPagado,0);
  const pct=+credito.capital_total>0?Math.min(totalPagado/+credito.capital_total*100,100):0;
  const pagadores=credito.qs_pagadores.map(p=>p.nombre).join(' + ');

  // Build pagador map
  const pagMap={};
  credito.qs_pagadores.forEach(p=>pagMap[p.id]=p.nombre);

  // Month selector — from inicio to now+3
  const hoy2=new Date();
  const mesesDisp=[];
  let cur=new Date(credito.fecha_inicio+'T12:00:00');
  cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  const lim=new Date(hoy2.getFullYear(),hoy2.getMonth()+3,1);
  while(cur<=lim){
    mesesDisp.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-01`);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  const mesSel=`${hoy2.getFullYear()}-${String(hoy2.getMonth()+1).padStart(2,'0')}-01`;

  let h='';
  h+=`<h3>${credito.responsable} — Crédito QS <span class="mx" onclick="closeM()">×</span></h3>`;

  // Summary cards
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">`;
  h+=`<div style="background:var(--cream);border-radius:10px;padding:12px"><div style="font-size:10px;font-weight:700;color:var(--muted)">CAPITAL</div><div style="font-weight:800;font-size:16px">${fmt(+credito.capital_total)}</div></div>`;
  h+=`<div style="background:var(--cream);border-radius:10px;padding:12px"><div style="font-size:10px;font-weight:700;color:var(--muted)">PAGADO</div><div style="font-weight:800;font-size:16px;color:var(--green)">${fmt(totalPagado)}</div></div>`;
  h+=`<div style="background:var(--cream);border-radius:10px;padding:12px"><div style="font-size:10px;font-weight:700;color:var(--muted)">SALDO</div><div style="font-weight:800;font-size:16px;color:var(--amber)">${fmt(saldo)}</div></div>`;
  h+=`</div>`;
  h+=`<div class="pw" style="margin-bottom:6px"><div class="pb" style="width:${pct}%;background:var(--forest3)"></div></div>`;
  h+=`<div style="font-size:11.5px;color:var(--muted);margin-bottom:16px">${pct.toFixed(1)}% pagado · Pagadores: <b>${pagadores}</b></div>`;

  // Register new payment
  h+=`<div style="background:var(--cream);border-radius:12px;padding:14px;margin-bottom:16px">`;
  h+=`<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.4px;text-transform:uppercase">Registrar pago</div>`;
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">`;
  h+=`<div style="flex:1;min-width:130px"><label style="font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px">MES</label>`;
  h+=`<select id="qs-mes-modal" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff">`;
  mesesDisp.slice().reverse().forEach(m=>{
    const d2=new Date(m+'T12:00:00');
    h+=`<option value="${m}" ${m===mesSel?'selected':''}>${mesN(d2.getMonth()+1)} ${d2.getFullYear()}</option>`;
  });
  h+=`</select></div>`;
  h+=`<div style="flex:1;min-width:130px"><label style="font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px">PAGADOR</label>`;
  h+=`<select id="qs-pag-modal" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff">`;
  credito.qs_pagadores.forEach(pg=>{h+=`<option value="${pg.id}">${pg.nombre}</option>`;});
  h+=`</select></div>`;
  h+=`<div style="flex:1;min-width:110px"><label style="font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px">VALOR ($)</label>`;
  h+=`<input type="number" id="qs-val-modal" step="0.01" placeholder="${(+credito.cuota_nominal/credito.qs_pagadores.length).toFixed(2)}" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff"></div>`;
  h+=`<button class="btn bfo" id="btn-qs-guardar-modal" data-creditoid="${creditoId}">Guardar</button>`;
  h+=`</div></div>`;

  // Payment history table
  h+=`<div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px">Historial de pagos (${(pagos||[]).length} registros)</div>`;
  if(!(pagos||[]).length){
    h+=`<div class="empty"><p>Sin pagos registrados para este crédito.</p></div>`;
  } else {
    h+=`<div style="max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:10px">`;
    h+=`<table><tr><th>Mes</th><th>Pagador</th><th class="num">Valor</th><th></th></tr>`;
    (pagos||[]).forEach(p=>{
      const d2=new Date(p.mes+'T12:00:00');
      const pnombre=pagMap[p.qs_pagador_id]||'?';
      h+=`<tr>`;
      h+=`<td style="font-size:13px;font-weight:600">${mesN(d2.getMonth()+1)} ${d2.getFullYear()}</td>`;
      h+=`<td>${pnombre}</td>`;
      h+=`<td class="num pos"><b>${fmt(p.valor)}</b></td>`;
      h+=`<td><button class="btn bgh xs" data-action="qs-edit-modal" data-pagoid="${p.id}" data-val="${p.valor}" data-pag="${pnombre}" aria-label="Editar pago">Editar</button></td>`;
      h+=`</tr>`;
    });
    h+=`</table></div>`;
  }

  openM(h);

  // Attach save handler
  document.getElementById('btn-qs-guardar-modal').onclick=async function(){
    const mes=document.getElementById('qs-mes-modal').value;
    const pagadorId=document.getElementById('qs-pag-modal').value;
    const v=+document.getElementById('qs-val-modal').value;
    if(!v){toast('Escribe el valor.');return}
    const btn=this; btn.disabled=true; btn.textContent='Guardando…';
    const{error}=await SB.from('qs_pagos').upsert({
      qs_credito_id:creditoId,
      qs_pagador_id:pagadorId,
      mes:mes,
      valor:v
    },{onConflict:'qs_pagador_id,mes'});
    if(error){toast(errTxt('guardar el pago',error),5000);btn.disabled=false;btn.textContent='Guardar';return}
    toast('Pago registrado ✓');
    // Refresh modal + main view
    await rQS();
    vQSCredito(creditoId);
  };
}

async function rP(){
  $('#main').innerHTML=ld();
  const uid=U.id;
  const[{data:ing},{data:gas},{data:pre}]=await Promise.all([
    SB.from('ingresos').select('*').eq('usuario_id',uid).eq('anio',anioV).eq('mes',mesV).order('created_at'),
    SB.from('gastos').select('*').eq('usuario_id',uid).eq('anio',anioV).eq('mes',mesV).order('created_at'),
    SB.from('presupuestos').select('*').eq('usuario_id',uid).eq('anio',anioV).eq('mes',mesV).maybeSingle()
  ]);
  const tI=(ing||[]).reduce((a,r)=>a+(+r.valor),0);
  const pN=pre?.pct_necesidades||50,pD=pre?.pct_deseos||30,pA=pre?.pct_ahorros||20;
  const bN=tI*pN/100,bD=tI*pD/100,bA=tI*pA/100;
  const gN=(gas||[]).filter(g=>g.naturaleza==='Necesidades').reduce((a,g)=>a+(+g.valor),0);
  const gD=(gas||[]).filter(g=>g.naturaleza==='Deseos').reduce((a,g)=>a+(+g.valor),0);
  const gA=(gas||[]).filter(g=>g.naturaleza==='Ahorros').reduce((a,g)=>a+(+g.valor),0);
  $('#main').innerHTML=`
  ${barraMes(`<button class="btn bfo sm" style="margin-left:auto" onclick="mPre(${pN},${pD},${pA})">Regla ${pN}/${pD}/${pA}</button>`)}
  <div class="g3" style="margin-bottom:18px">
    <div class="sc"><div class="sl">Ingresos</div><div class="sv pos">${fmt(tI)}</div>
      <button class="btn bgh sm" style="margin-top:8px;width:100%" onclick="mIng()">＋ Registrar</button></div>
    ${[['Necesidades',bN,gN,'var(--forest3)'],['Deseos',bD,gD,'var(--gold)'],['Ahorros',bA,gA,'var(--sage)']].map(([n,b,g,c])=>`
    <div class="sc"><div class="sl">${n}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:5px">
        <span style="font-size:20px;font-weight:800;color:${g>b&&b>0?'var(--red)':'var(--text)'}">${fmt(g)}</span>
        <span style="font-size:12px;color:var(--muted)">de ${fmt(b)}</span>
      </div>
      <div class="pw"><div class="pb" style="width:${Math.min(b>0?g/b*100:0,100)}%;background:${c}"></div></div>
      <div style="font-size:11px;color:var(--muted)">${b>0?((g/b*100).toFixed(0))+'% del presupuesto':'Sin presupuesto'}</div>
    </div>`).join('')}
  </div>
  <div class="g2">
    <div class="card"><div class="ctit">Ingresos <button class="btn bgo sm" onclick="mIng()">＋</button></div>
      ${!ing?.length?'<div class="empty"><p>Sin ingresos. Haz clic en ＋.</p></div>':''}
      <div class="tw"><table>${(ing||[]).map(r=>`<tr class="hv"><td>${r.concepto}</td><td class="num pos"><b>${fmt(r.valor)}</b></td>
        <td><button class="btn bda xs" aria-label="Eliminar ingreso" onclick="borrarConDeshacer({tabla:'ingresos',id:'${r.id}',msg:'Ingreso eliminado',despues:rP})">✕</button></td></tr>`).join('')}</table></div>
    </div>
    <div class="card"><div class="ctit">Gastos <button class="btn bgo sm" onclick="mGas()">＋</button></div>
      ${!gas?.length?'<div class="empty"><p>Sin gastos. Agrega manualmente o importa en Extractos.</p></div>':''}
      <div class="tw" style="max-height:420px;overflow-y:auto"><table>
        ${(gas||[]).map(g=>`<tr class="hv"><td><b>${g.concepto}</b><div style="font-size:11px;color:var(--muted)">${g.naturaleza}·${g.categoria}</div></td>
          <td class="num neg"><b>${fmt(g.valor)}</b></td>
          <td><button class="btn bda xs" aria-label="Eliminar gasto" onclick="borrarConDeshacer({tabla:'gastos',id:'${g.id}',msg:'Gasto eliminado',despues:rP})">✕</button></td></tr>`).join('')}
      </table></div>
    </div>
  </div>`;
}

  document.getElementById('btn-sav-pre').onclick=async()=>{

}

// Reúne todo lo que dejó la importación: historial, gastos importados,
// pagos guardados como ingreso (coinciden con un PAGO del historial) y deudas creadas desde diferidos.
async function reunirImportados(){
  const uid=U.id;
  const[ext,gas,ing,obl]=await Promise.all([
    SB.from('extractos').select('*').eq('usuario_id',uid),
    SB.from('gastos').select('*').eq('usuario_id',uid).eq('fuente','importado'),
    SB.from('ingresos').select('*').eq('usuario_id',uid),
    SB.from('obligaciones').select('*,cuotas(*)').eq('titular_id',uid).ilike('notas','%[dif:%')
  ]);
  const err=ext.error||gas.error||ing.error||obl.error;
  if(err)throw err;
  const pagos=new Set((ext.data||[]).filter(r=>r.tipo_op==='PAGO').map(r=>r.concepto+'|'+(+r.valor).toFixed(2)));
  return{extractos:ext.data||[],gastos:gas.data||[],
    ingresos:(ing.data||[]).filter(r=>pagos.has(r.concepto+'|'+(+r.valor).toFixed(2))),
    obligaciones:obl.data||[]};
}

async function borrarEnLotes(tabla,ids){for(let i=0;i<ids.length;i+=100){const{error}=await SB.from(tabla).delete().in('id',ids.slice(i,i+100));if(error)throw error}}
async function insertarEnLotes(tabla,filas){for(let i=0;i<filas.length;i+=200){const{error}=await SB.from(tabla).insert(filas.slice(i,i+200));if(error)throw error}}
async function borrarImportados(){
  const elegir=k=>document.getElementById('bi-'+k)?.checked?_imp[k]:[];
  const c={extractos:elegir('extractos'),gastos:elegir('gastos'),ingresos:elegir('ingresos'),obligaciones:elegir('obligaciones')};
  const total=c.extractos.length+c.gastos.length+c.ingresos.length+c.obligaciones.length;
  if(!total)return toast('Marca al menos una opción.');
  const btn=document.getElementById('btn-borrar-imp');btn.disabled=true;btn.textContent='Borrando…';
  // Copia para deshacer (las cuotas se borran en cascada con su deuda)
  const obls=c.obligaciones.map(({cuotas,...o})=>o), cuotas=c.obligaciones.flatMap(o=>o.cuotas||[]);
  try{
    await borrarEnLotes('obligaciones',obls.map(o=>o.id));
    await borrarEnLotes('gastos',c.gastos.map(r=>r.id));
    await borrarEnLotes('ingresos',c.ingresos.map(r=>r.id));
    await borrarEnLotes('extractos',c.extractos.map(r=>r.id));
  }catch(e){btn.disabled=false;btn.textContent='Borrar lo seleccionado';return toast(errTxt('borrar todo lo seleccionado',e),6000)}
  closeM();carHist();
  toastDeshacer(`Borrados ${total} registros importados`,async()=>{

async function parsePDF(file){
  if(typeof pdfjsLib==='undefined')return toast('No se pudo cargar el lector de PDF. Revisa tu conexión y recarga la página.',5000);
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const ab=await file.arrayBuffer();
  let allLines=[];
  try{
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      const byY={};
      tc.items.forEach(item=>{
        const y=Math.round(item.transform[5]);
        if(!byY[y])byY[y]=[];
        byY[y].push({x:item.transform[4],t:item.str});
      });
      Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
        const linea=byY[y].sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ').trim();
        if(linea)allLines.push(linea);
      });
    }
    // PDF de imágenes (p. ej. PacifiCard): sin texto → se lee con OCR dentro del navegador
    _ocr=allLines.join('').replace(/\s/g,'').length<40;
    if(_ocr){
      const ocr=await lineasConOCR(pdf);
      if(!ocr)return;
      _ocrImgs=new Map();
      allLines=ocr.map(o=>{const n=normalizarOCR(o.t);if(o.img)_ocrImgs.set(n,o.img);return n});
    }
  }catch(e){console.error(e);toast('No se pudo leer el PDF. Usa el PDF que descargas del banco.',6000);return}
  _lineasExt=allLines;
  const texto=allLines.join('\n');
  const banco=detBanco(texto);
  if(banco==='PacifiCard') parsPC(allLines);
  else if(banco==='Diners'||banco==='Discover') parsDC(allLines,banco);
  else if(banco==='Pichincha') parsPI(allLines);
  else{toast('Banco no reconocido. Usa la plantilla Excel.',4000);parsGen(allLines,banco)}
}
// ── OCR (Tesseract, dentro del navegador: la imagen no sale del equipo) ──
let _ocr=false, _ocrImgs=new Map();
function cargarScript(src){return new Promise((ok,mal)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=mal;document.head.appendChild(s)})}
async function lineasConOCR(pdf){
  try{if(typeof Tesseract==='undefined')await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
  catch(e){console.error(e);toast('No se pudo cargar el lector de imágenes (OCR). Revisa tu conexión e inténtalo de nuevo.',6000);return null}
  const lineas=[];
  try{
    toast('El PDF es una imagen: leyendo el texto con OCR…',60000);
    const worker=await Tesseract.createWorker('spa');
    await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
    for(let p=1;p<=pdf.numPages;p++){
      toast(`Leyendo con OCR la página ${p} de ${pdf.numPages}…`,60000);
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:3});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      // Escala de grises: en las pruebas dio mejores dígitos que binarizar
      const img=ctx.getImageData(0,0,c.width,c.height),d=img.data;
      for(let i=0;i<d.length;i+=4){const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=g}
      ctx.putImageData(img,0,0);
      const{data}=await worker.recognize(c,{},{text:true,blocks:true});
      const lin=data.lines||(data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>p.lines||[]));
      if(lin.length){
        lin.forEach(L=>{
          const t=(L.text||'').trim();if(!t)return;
          // Recorte de la línea (para comparar el monto leído con la imagen original)
          let img=null;
          try{const b=L.bbox,pad=6,w=b.x1-b.x0+2*pad,hh=b.y1-b.y0+2*pad;
            const k=document.createElement('canvas');k.width=Math.round(w/2);k.height=Math.round(hh/2);
            k.getContext('2d').drawImage(c,b.x0-pad,b.y0-pad,w,hh,0,0,k.width,k.height);img=k.toDataURL('image/jpeg',0.85)}catch(e){}
          lineas.push({t,img});
        });
      }else data.text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(t=>lineas.push({t,img:null}));
    }
    await worker.terminate();
    toast('Texto leído. Revisa los montos antes de importar.',3000);
  }catch(e){console.error(e);toast('No se pudo leer la imagen del PDF con OCR.',6000);return null}
  return lineas;
}
// Corrige confusiones típicas del OCR para que los lectores de cada banco reconozcan las líneas.
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function distancia(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function mesOCR(t){const u=t.toUpperCase().replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S');
  let mejor=null,dm=9;MES3.forEach(m=>{const d=distancia(u,m);if(d<dm){dm=d;mejor=m}});return dm<=2?mejor:null}
const digitoOCR=s=>s.replace(/[oOQD]/g,'0').replace(/[iIl|!]/g,'1').replace(/[zZ]/g,'2').replace(/[sS]/g,'5').replace(/B/g,'8').replace(/[gq]/g,'9');
function normalizarOCR(l){
  let t=l.replace(/€/g,'').replace(/\s{2,}/g,'  ');

  const m=/^([A-Za-z]{3})\s?[\/;:,.]?\s?([A-Za-z0-9|]{1,2})\s+(\S+)\s+(.*)$/.exec(t);
  // Solo es un movimiento si la referencia (3.ª palabra) es casi toda dígitos
  if(m&&mesOCR(m[1])&&(digitoOCR(m[3]).match(/\d/g)||[]).length>=Math.max(3,m[3].length-2)){
    let dia=digitoOCR(m[2]);if(!/^\d{1,2}$/.test(dia)||+dia<1||+dia>31)dia='01';
    t=`${mesOCR(m[1])}/${dia.padStart(2,'0')} ${digitoOCR(m[3])} ${m[4]}`
      .replace(/\b(c[o0]n[a-z0-9]?|[o0]na|c[o0]ns)\b/gi,'CONS').replace(/\b[PF]A[GS5]O\b/gi,'PAGO').replace(/\bD[I1l]F\b/g,'DIF');

function detBanco(t){

const MESES2={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,OCT:10,NOV:11,DIC:12};
function parsPC(lineas){
  let sec=false;
  const re=/^([A-Z]{3})\/(\d{1,2})\s+(\S+)\s+(.+?)\s+(?:(\d{1,2})\/(\d{1,2})\s+)?(CONS|DIF|PAGO|N\/D|AV)\s+([\d,\.]+)(?:\s*[+-]\s*(\d{1,3}(?:,\d{3})*\.\d{2}))?/;
  for(const l of lineas){
    if(l.includes('DETALLE DE MOVIMIENTOS')||/SALDO\s+ANTERIOR/.test(l)){sec=true;continue}
    if(!sec)continue;
    if(/TOTAL\s+[PF]AGO\s+DE\s+CONTADO/.test(l)||l.includes('CONCEPTOS BÁSICOS'))break;
    const m=re.exec(l);
    if(m){
      const[,mes,dia,,desc,cn,ct,tipo,val,sdif]=m;
      const mn=MESES2[mes]||MES;
      const v=parseFloat(val.replace(/,(?=\d{3})/g,'').replace(',','.'));
      const cuota=cn?` (${cn}/${ct})`:'';
      if(v>0)extB.push({banco:'PacifiCard',fecha_tx:`${ANIO}-${String(mn).padStart(2,'0')}-${String(dia).padStart(2,'0')}`,concepto:(desc.trim().replace(/\s+/g,' '))+cuota,tipo_op:tipo,valor:v,categoria:acat(desc),
        _saldoDif:tipo==='DIF'&&sdif?parseFloat(sdif.replace(/,/g,'')):undefined,_linea:l});
    }
  }
}
function parsDC(lineas,banco){

    if(l.includes('Consumo período actual')||l.includes('Detalle débitos y créditos')){sec=true;continue}

      }
    }
  }
}
function parsPI(lineas){

  const rePago=/^(\d{2})\/(\d{2})\s+(\d+)\s+(SU PAGO.+?)\s+([\d.,]+)-\s*$/;

    if(l.includes('SUBTOTAL'))continue;
    const mp=rePago.exec(l);
    if(mp){const[,dd,mm,,desc,val]=mp;const v=parseFloat(val.replace(/\./g,'').replace(',','.'));if(v>0)extB.push({banco:'Pichincha',fecha_tx:`${ANIO}-${mm}-${dd}`,concepto:desc.trim(),tipo_op:'PAGO',valor:v,categoria:'Pago'});continue}
    const m=reMain.exec(l);

      const v=parseFloat(val.replace(/\./g,'').replace(',','.'));
      if(v>0){
        let tipo='CONS';if(op==='DIFERIDO')tipo='DIF';else if(op==='N/D')tipo='ND';else if(op==='PAGO')tipo='PAGO';

          _saldoDif:tipo==='DIF'&&sdif?parseFloat(sdif.replace(/\./g,'').replace(',','.')):undefined,_linea:l});
      }
    }
  }

let _lineasExt=[], _corte=null;
const MESES_ES={ENE:1,ENERO:1,FEB:2,FEBRERO:2,MAR:3,MARZO:3,ABR:4,ABRIL:4,MAY:5,MAYO:5,JUN:6,JUNIO:6,JUL:7,JULIO:7,

// Busca una fecha (dd/mm/aaaa, dd-mmm-aaaa, "25 de octubre de 2026"…) dentro de un texto.
function leerFecha(t){
  const sinAcento=t.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  let m=/(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{2,4})/.exec(sinAcento);
  if(m){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo>=1&&mo<=12&&d>=1&&d<=31)return{anio:y,mes:mo,dia:d}}

  if(m&&MESES_ES[m[2]]){let y=+m[3];if(y<100)y+=2000;return{anio:y,mes:MESES_ES[m[2]],dia:+m[1]}}

// 1) Fecha junto a una etiqueta del estado de cuenta (misma línea o las dos siguientes), en orden de prioridad:
//    "Fecha de corte", "Fecha de emisión" (Pichincha), "Período hasta", "Corte al", "Fecha de facturación".
// 2) Si no aparece: la fecha del último consumo o pago (con año de hoy o el anterior).
const ETIQUETAS_CORTE=[/FECHA\s*(DE\s*)?CORTE/,/FECHA\s*(DE\s*)?EMISION/,/PERIODO\s*HASTA/,/CORTE\s*AL/,

function detectarCorte(lineas,filas){
  const U=lineas.map(l=>l.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase());
  for(const et of ETIQUETAS_CORTE){
    for(let i=0;i<U.length;i++){
      const k=et.exec(U[i]);if(!k)continue;
      for(const t of [U[i].slice(k.index),U[i+1]||'',U[i+2]||'']){
        const f=leerFecha(t);
        if(f&&f.anio>=2015&&f.anio<=ANIO+1)return{...f,origen:'pdf'};
      }
    }
  }
  const hoy=new Date();let mejor=null;

    let d=new Date(ANIO,r._mm-1,r._dd);if(d>hoy)d=new Date(ANIO-1,r._mm-1,r._dd);

let _oblsLD=[], _difs=[];
const TARJETA={Pichincha:'VISA BCO PICHINCHA',Diners:'DINERS CLUB',Discover:'DISCOVER',PacifiCard:'PACIFICARD'};
const baseDif=c=>c.replace(/\s*\(\d+\/\d+\)\s*$/,'').trim();
function cuotaDif(c){const m=/\((\d+)\/(\d+)\)\s*$/.exec(c||'');return m?{n:+m[1],N:+m[2]}:null}
async function cargarDeudasTarjeta(){

// Agrupa las líneas iguales (mismo banco, concepto, cuota y valor): se cobran juntas cada mes.
function agruparDiferidos(rows){
  const g={};
  rows.forEach(r=>{
    if(r.tipo_op!=='DIF')return;
    const q=cuotaDif(r.concepto);if(!q||q.N<2||q.n<1||q.n>q.N)return;
    const base=baseDif(r.concepto);
    const k=[r.banco,base.toUpperCase(),q.n,q.N,r.valor].join('|');
    if(!g[k])g[k]={banco:r.banco,base,n:q.n,N:q.N,valor:0,veces:0,saldoBanco:0,conSaldo:true};
    g[k].valor=r2(g[k].valor+r.valor);g[k].veces++;
    if(r._saldoDif>=0)g[k].saldoBanco=r2(g[k].saldoBanco+r._saldoDif);else g[k].conSaldo=false;
  });
  return Object.values(g).map(d=>({...d,pendiente:d.conSaldo?r2(d.saldoBanco+d.valor):r2(d.valor*(d.N-d.n+1)),marca:`[dif:${d.banco}|${d.base.toUpperCase()}|${d.N}]`}));
}
// Fecha (1.º de mes) de la cuota k, sabiendo que la cuota n se cobra en el mes que se está importando.
function fechaCuotaDif(d,k){const x=new Date(_corte.anio,_corte.mes-1+(k-d.n),1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-01`}
function accionDifPorDefecto(d){

function opcionesDif(d){

  const def=accionDifPorDefecto(d);

async function aplicarDiferido(d,accion){
  const uid=U.id;
  if(accion==='omitir')return 'omitida';
  if(accion==='nueva'){
    const{data:obl,error}=await SB.from('obligaciones').insert({
      titular_id:uid,deudor_id:uid,nombre:d.base,descripcion:'Avances / Tarjetas',segmento:'Avances / Tarjetas',
      deudor_nombre:TARJETA[d.banco]||d.banco,monto_total:r2(d.valor*(d.n-1)+d.pendiente),valor_cuota:d.valor,num_cuotas:d.N,
      fecha_inicio:fechaCuotaDif(d,1),estado:'activa',es_deuda_propia:true,
      notas:`Diferido importado del estado de cuenta (${d.banco}).\n${d.marca}`
    }).select().single();
    if(error){console.error(error);return 'error'}
    const rows=[];
    for(let k=1;k<=d.N;k++){
      const pagada=k<d.n;
      rows.push({obligacion_id:obl.id,numero:k,concepto:`Cuota ${k}`,fecha_prog:fechaCuotaDif(d,k),
        valor_esperado:k===d.N?r2(d.pendiente-d.valor*(d.N-d.n)):d.valor,valor_pagado:pagada?d.valor:0,estado:pagada?'pagado':'pendiente',fecha_pago:pagada?fechaCuotaDif(d,k):null});
    }
    const{error:e2}=await SB.from('cuotas').insert(rows);
    if(e2){console.error(e2);await SB.from('obligaciones').delete().eq('id',obl.id);return 'error'}
    return 'creada';
  }
  const o=_oblsLD.find(x=>'act:'+x.id===accion);
  if(!o)return 'error';
  for(const c of (o.cuotas||[]).filter(c=>c.numero<d.n&&c.estado!=='pagado')){
    const{error}=await SB.from('cuotas').update({valor_pagado:c.valor_esperado,estado:'pagado',fecha_pago:fechaCuotaDif(d,c.numero)}).eq('id',c.id);
    if(error){console.error(error);return 'error'}
  }
  if(!(o.notas||'').includes(d.marca)){
    await SB.from('obligaciones').update({notas:((o.notas||'')+'\n'+d.marca).trim()}).eq('id',o.id);
  }
  return 'actualizada';
}

function leerMonto(s){s=String(s).trim();if(/,\d{2}$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));return parseFloat(s.replace(/,/g,''))}
// Total que informa el banco, para comparar con la suma de los cargos leídos (sin pagos)
let _totalManual=null,_lineaTotal=null;
function totalBanco(){
  if(_totalManual!=null)return _totalManual;
  const et=[/TOTAL\s+[PF]AGO\s+DE\s+CONTADO/i,/TOTAL\s+A\s+PAGAR/i,/TOTAL\s+DE\s+CONSUMOS/i];
  for(const re of et){
    for(let i=0;i<_lineasExt.length;i++){
      if(!re.test(_lineasExt[i]))continue;
      for(const t of [_lineasExt[i].slice(_lineasExt[i].search(re)),_lineasExt[i+1]||'']){
        const m=t.match(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2}(?!\d)/);
        if(m){_lineaTotal=_lineasExt[i];return leerMonto(m[0])}
      }
    }
  }
  return null;
}

        <td><span class="badge bm" style="font-size:10px">${o.segmento||'—'}</span></td>
        <td class="num neg">${fmt(o.saldo)}</td><td class="num">${fmt(o.cm)}</td>
        <td><span class="badge br">${o.cm>0?Math.ceil(o.saldo/o.cm):'+99'} meses</span></td>
        <td id="nb${i}"><span class="badge bm">— calcula →</span></td></tr>`).join('')}
    </table></div>
    <div id="res-n" style="margin-top:14px"></div>
  </div>`:'<div class="empty"><p>No tienes deudas propias activas. ¡Excelente posición!</p></div>'}`;
  window._dn=d;
}
function calcN(){
  const ex=+document.getElementById('sx').value||0;const d=window._dn;if(!d)return;
  let ac=ex,tot=0;
  d.forEach((o,i)=>{const ct=o.cm+ac;const m=ct>0?Math.ceil(o.saldo/ct):99;
    if(m>tot)tot=m;ac+=o.cm;
    const el=document.getElementById('nb'+i);if(el)el.innerHTML=`<span class="badge bg">${m>=99?'+99':m} meses</span>`;
  });
  const rn=document.getElementById('res-n');
  if(rn)rn.innerHTML=`<div style="background:var(--green-bg);border-radius:10px;padding:13px;color:var(--green);font-size:13.5px">
    <b>Resultado:</b> Con ${fmt(ex)} extra/mes, deuda más larga: ~<b>${tot} meses</b>. Total mensual: <b>${fmt(d.reduce((a,o)=>a+o.cm,0)+ex)}</b>.
  </div>`;
  toast('Plan calculado ✓');
}

</script>
